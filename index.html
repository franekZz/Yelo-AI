<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yelo AI</title>
    <style>
        :root {
            --bg-color: #0d0f18;
            --panel-bg: rgba(20, 23, 38, 0.7);
            --border-color: rgba(138, 43, 226, 0.2);
            --accent-primary: #8a2be2;
            --accent-glow: rgba(138, 43, 226, 0.4);
            --text-main: #f0f2f5;
            --text-muted: #94a3b8;
            --user-bubble: linear-gradient(135deg, #8a2be2, #4b0082);
            --ai-bubble: rgba(30, 34, 54, 0.8);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(138, 43, 226, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(0, 255, 255, 0.05) 0%, transparent 40%);
        }

        header {
            padding: 20px;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            background: var(--user-bubble);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        h1 {
            font-size: 1.4rem;
            letter-spacing: 0.5px;
            background: linear-gradient(90deg, #fff, #b19cd9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
        }

        .message {
            display: flex;
            max-width: 80%;
            animation: fadeIn 0.3s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            margin-left: auto;
            justify-content: flex-end;
        }

        .message.ai {
            margin-right: auto;
            justify-content: flex-start;
        }

        .bubble {
            padding: 14px 18px;
            border-radius: 16px;
            line-height: 1.5;
            font-size: 0.95rem;
            word-break: break-word;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        .user .bubble {
            background: var(--user-bubble);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .ai .bubble {
            background: var(--ai-bubble);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-bottom-left-radius: 4px;
        }

        .input-area {
            padding: 20px;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: center;
        }

        .input-wrapper {
            max-width: 900px;
            width: 100%;
            display: flex;
            gap: 12px;
            background: rgba(15, 17, 26, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 8px 12px;
            transition: all 0.3s ease;
        }

        .input-wrapper:focus-within {
            border-color: var(--accent-primary);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        input[type="text"] {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 1rem;
            padding: 8px;
            outline: none;
        }

        input[type="text"]::placeholder {
            color: var(--text-muted);
        }

        button {
            background: var(--user-bubble);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 0 20px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }

        button:hover {
            opacity: 0.9;
        }

        button:active {
            transform: scale(0.96);
        }

        .settings-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 6px 12px;
            font-size: 0.85rem;
            border-radius: 8px;
            cursor: pointer;
        }
        .settings-btn:hover {
            color: white;
            border-color: var(--accent-primary);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <div class="logo-icon">Y</div>
            <h1>Yelo AI</h1>
        </div>
        <button class="settings-btn" onclick="setApiKey()">Klucz API</button>
    </header>

    <div class="chat-container" id="chatContainer">
        <div class="message ai">
            <div class="bubble">Cześć! Jestem Yelo AI, Twój asystent oparty na modelu Qwen. W czym mogę Ci dzisiaj pomóc?</div>
        </div>
    </div>

    <div class="input-area">
        <div class="input-wrapper">
            <input type="text" id="userInput" placeholder="Napisz wiadomość do Yelo AI..." onkeydown="handleKeyPress(event)">
            <button onclick="sendMessage()">Wyślij</button>
        </div>
    </div>

    <script>
        // Pobieramy lub ustawiamy klucz API (możesz wpisać swój domyślny lub pytać użytkownika)
        let apiKey = localStorage.getItem("yelo_api_key") || "";

        function setApiKey() {
            const key = prompt("Wpisz swój darmowy klucz API (np. z Groq lub OpenRouter):", apiKey);
            if (key !== null) {
                apiKey = key.trim();
                localStorage.setItem("yelo_api_key", apiKey);
                alert("Klucz zapisany!");
            }
        }

        async function sendMessage() {
            const inputField = document.getElementById("userInput");
            const text = inputField.value.trim();
            if (!text) return;

            if (!apiKey) {
                alert("Najpierw kliknij przycisk 'Klucz API' w prawym górnym rogu i podaj klucz!");
                setApiKey();
                if (!apiKey) return;
            }

            // Dodaj wiadomość użytkownika do czatu
            appendMessage(text, 'user');
            inputField.value = "";

            // Kontener na odpowiedź AI (wskaźnik ładowania)
            const aiMessageId = appendMessage("Yelo myśli...", 'ai');

            try {
                // Zapytanie do darmowego i szybkiego API (np. Groq obsługujący modele Qwen)
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${apiKey}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "qwen-2.5-32b", // Wybieramy model Qwen
                        messages: [
                            { role: "system", content: "Jesteś pomocnym asystentem o nazwie Yelo AI. Odpowiadaj zwięźle i naturalnie po polsku." },
                            { role: "user", content: text }
                        ]
                    })
                });

                const data = await response.json();
                
                if (data.error) {
                    updateMessage(aiMessageId, "Błąd API: " + data.error.message);
                } else {
                    const reply = data.choices[0].message.content;
                    updateMessage(aiMessageId, reply);
                }
            } catch (error) {
                updateMessage(aiMessageId, "Wystąpił błąd połączenia z serwerem AI.");
            }
        }

        function appendMessage(text, sender) {
            const chatContainer = document.getElementById("chatContainer");
            const messageDiv = document.createElement("div");
            messageDiv.className = `message ${sender}`;
            
            const bubbleDiv = document.createElement("div");
            bubbleDiv.className = "bubble";
            bubbleDiv.innerText = text;
            
            messageDiv.appendChild(bubbleDiv);
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            
            return bubbleDiv; // Zwracamy referencję do bąbelka, żeby móc podmienić tekst podczas ładowania
        }

        function updateMessage(bubbleElement, text) {
            bubbleElement.innerText = text;
            const chatContainer = document.getElementById("chatContainer");
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function handleKeyPress(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        }
    </script>
</body>
</html>
