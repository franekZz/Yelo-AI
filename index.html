<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yelo AI</title>
    <style>
        :root {
            --bg-main: #131316;
            --bg-sidebar: #18181b;
            --bg-panel: #1e1e24;
            --border-color: rgba(255, 255, 255, 0.08);
            --accent: #8b5cf6;
            --accent-hover: #7c3aed;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --bubble-user: #27272a;
            --bubble-ai: transparent;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* Sidebar */
        sidebar {
            width: 260px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 16px;
            gap: 16px;
        }

        .new-chat-btn {
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background 0.2s;
        }

        .new-chat-btn:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .history-item {
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            color: var(--text-muted);
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-item:hover {
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-main);
        }

        /* Main Chat Area */
        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            position: relative;
        }

        .chat-header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border-color);
            background: rgba(19, 19, 22, 0.8);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 1.1rem;
        }

        .brand-dot {
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent);
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            scroll-behavior: smooth;
        }

        .message-row {
            display: flex;
            width: 100%;
            justify-content: center;
        }

        .message-content {
            max-width: 768px;
            width: 100%;
            display: flex;
            gap: 16px;
            padding: 0 16px;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.85rem;
            flex-shrink: 0;
        }

        .user-avatar {
            background: #3f3f46;
            color: white;
        }

        .ai-avatar {
            background: var(--accent);
            color: white;
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.3);
        }

        .message-text {
            line-height: 1.6;
            font-size: 0.95rem;
            color: var(--text-main);
            padding-top: 4px;
            word-break: break-word;
        }

        /* Input Container */
        .input-container {
            padding: 20px 24px;
            background: linear-gradient(to top, var(--bg-main) 80%, transparent);
            display: flex;
            justify-content: center;
        }

        .input-box {
            max-width: 768px;
            width: 100%;
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 12px 16px;
            display: flex;
            align-items: flex-end;
            gap: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            transition: border-color 0.2s;
        }

        .input-box:focus-within {
            border-color: rgba(255, 255, 255, 0.2);
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 0.95rem;
            resize: none;
            outline: none;
            max-height: 200px;
            line-height: 1.5;
            padding-top: 4px;
        }

        textarea::placeholder {
            color: var(--text-muted);
        }

        .send-btn {
            background: var(--text-main);
            color: var(--bg-main);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            flex-shrink: 0;
        }

        .send-btn:hover {
            opacity: 0.9;
        }

        .send-btn:active {
            transform: scale(0.95);
        }

        /* Loading indicator */
        .typing-indicator span {
            height: 8px;
            width: 8px;
            float: left;
            margin: 0 2px;
            background-color: var(--text-muted);
            border-radius: 50%;
            display: inline-block;
            animation: bounce 1.3s infinite ease-in-out;
        }
        .typing-indicator span:nth-child(2) { animation-delay: -1.1s; }
        .typing-indicator span:nth-child(3) { animation-delay: -0.9s; }

        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-6px); }
        }

        @media (max-width: 768px) {
            sidebar { display: none; }
        }
    </style>
</head>
<body>

    <sidebar>
        <button class="new-chat-btn" onclick="location.reload()">
            <span>+</span> Nowa rozmowa
        </button>
        <div class="history-list">
            <div class="history-item">Rozmowa z Yelo AI</div>
        </div>
    </sidebar>

    <div class="chat-main">
        <header class="chat-header">
            <div class="brand">
                <div class="brand-dot"></div>
                Yelo AI
            </div>
        </header>

        <div class="chat-messages" id="chatMessages">
            <div class="message-row">
                <div class="message-content">
                    <div class="avatar ai-avatar">Y</div>
                    <div class="message-text">Cześć. Jestem Yelo AI. W czym mogę Ci dzisiaj pomóc?</div>
                </div>
            </div>
        </div>

        <div class="input-container">
            <div class="input-box">
                <textarea id="userInput" rows="1" placeholder="Wiadomość do Yelo AI..." onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
                <button class="send-btn" onclick="sendMessage()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        // Automatyczne powiększanie pola tekstowego
        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = textarea.scrollHeight + 'px';
        }

        function handleKey(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;

            input.value = '';
            input.style.height = 'auto';

            // Dodaj wiadomość użytkownika
            appendMessage(text, 'user');

            // Kontener na odpowiedź AI ze wskaźnikiem pisania
            const aiRow = appendMessage('<div class="typing-indicator"><span></span><span></span><span></span></div>', 'ai', true);
            const textElement = aiRow.querySelector('.message-text');

            try {
                // TUTAJ PODPINAMY BEZPIECZNY BACKEND / PROXY (np. Cloudflare Worker lub Twój serwer), 
                // który ukrywa klucz API przed użytkownikami strony.
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": "Bearer TUTAJ_BEZPIECZNY_KLUCZ_PROXY", // W wersji produkcyjnej idzie to przez Twój skrypt na serwerze
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "qwen-2.5-32b",
                        messages: [
                            { role: "system", content: "Jesteś profesjonalnym systemem sztucznej inteligencji Yelo AI. Odpowiadaj naturalnie i mądrze po polsku." },
                            { role: "user", content: text }
                        ]
                    })
                });

                const data = await response.json();
                if (data.choices && data.choices[0]) {
                    textElement.innerText = data.choices[0].message.content;
                } else {
                    textElement.innerText = "Wystąpił błąd podczas generowania odpowiedzi.";
                }
            } catch (err) {
                textElement.innerText = "Błąd połączenia z serwerem Yelo AI.";
            }
        }

        function appendMessage(htmlContent, sender, isRawHtml = false) {
            const container = document.getElementById('chatMessages');
            
            const row = document.createElement('div');
            row.className = 'message-row';

            const content = document.createElement('div');
            content.className = 'message-content';

            const avatar = document.createElement('div');
            avatar.className = `avatar ${sender === 'user' ? 'user-avatar' : 'ai-avatar'}`;
            avatar.innerText = sender === 'user' ? 'U' : 'Y';

            const text = document.createElement('div');
            text.className = 'message-text';

            if (isRawHtml) {
                text.innerHTML = htmlContent;
            } else {
                text.innerText = htmlContent;
            }

            content.appendChild(avatar);
            content.appendChild(text);
            row.appendChild(content);
            container.appendChild(row);

            container.scrollTop = container.scrollHeight;
            return row;
        }
    </script>
</body>
</html>
